[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-document-reviewer"
version = "0.1.0"
description = "Local-first geotechnical report review and CRS generation application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40,<2",
    "PyMuPDF>=1.24,<2",
    "openpyxl>=3.1,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geo_document_reviewer = ["**/*.md", "**/*.txt", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
